version: '3.8'

services:
  app:
    build: .
    ports:
      - "8000:8000"
    env_file: .env
    command: [ "/wait-for-db.sh", "database", "python", "bot/api.py" ]
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/health" ]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      database:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  init-db:
    build: .
    env_file: .env
    command: python database/init_db.py
    depends_on:
      database:
        condition: service_healthy
    volumes:
      - .:/app

  database:
    image: postgres:13
    env_file: .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 20s

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 20s

  bot:
    build: .
    env_file: .env
    depends_on:
      rabbitmq:
        condition: service_healthy
      database:
        condition: service_healthy
      app:
        condition: service_healthy
    command: [ "/wait-for-db.sh", "database", "python", "telegram_bot.py" ]

  worker:
    build:
      context: .
      dockerfile: worker/Dockerfile
    env_file: .env
    depends_on:
      rabbitmq:
        condition: service_healthy
      database:
        condition: service_healthy
      app:
        condition: service_healthy
    environment:
      WORKER_ID: worker1
      PYTHONPATH: /app

volumes:
  rabbitmq_data:
  postgres_data: